<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Junction</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/icon.png" type="image/png" />
  <!-- Ionicons CDN -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <nav class="navbar">
      <a href="#" class="logo"><ion-icon name="fast-food"></ion-icon> Food Junction</a>
      <div class="cart-icon">
        <span class="cart-count">0</span>
        <ion-icon name="cart" id="cart-icon"></ion-icon>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container">
    <h2 class="section-title">Let's Order Some Delicious Food</h2>
    <div class="shop-content">
      <!-- Repeat this block for each food item -->
      <div class="food-box">
        <div class="pic">
          <img src="assets/burger.jpg" alt="Burger" class="food-image" />
        </div>
        <h3 class="food-title">Burger</h3>
        <p class="food-description">Crispy Chicken</p>
        <span class="food-price">Rs. 99</span>
        <button class="add-cart"><ion-icon name="cart"></ion-icon></button>
      </div>
      <!-- Add more food-boxes as needed -->
    </div>
  </main>

  <!-- Cart Sidebar -->
  <aside class="cart">
    <div class="cart-header">
      <h3>Cart Items</h3>
      <ion-icon name="close" id="cart-close"></ion-icon>
    </div>
    <div class="cart-content"></div>
    <div class="cart-footer">
      <div class="total">
        <span>Total:</span>
        <span class="total-price">Rs. 0</span>
      </div>
      <button class="btn-buy" onclick="showAlert()">Place Order</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
